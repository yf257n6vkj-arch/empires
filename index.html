<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Empires</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%232f5f8a%22/%3E%3Cpath d=%22M3 12 L7 4 L9 8 L10.5 6 L13 12 Z%22 fill=%22%236fa84a%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/web/style.css" />
  </head>
  <body>
    <header>
      <h1>Empires</h1>
      <span class="phase">fáze 0 · generátor mapy</span>
    </header>
    <main>
      <div class="map-wrap">
        <canvas id="map"></canvas>
        <div id="tooltip" hidden></div>
      </div>
      <aside>
        <section>
          <label for="seed">Semeno mapy</label>
          <div class="row">
            <input id="seed" type="text" spellcheck="false" />
            <button id="generate" type="button">Vytvořit</button>
          </div>
          <button id="random" type="button" class="wide">Nová náhodná mapa</button>
        </section>
        <section>
          <label for="view">Co vidím</label>
          <select id="view"></select>
          <p class="hint">Pohled hráče ukazuje jen to, co hráč na začátku zná. Přesně tohle dostane i AI.</p>
        </section>
        <section>
          <h2>Terén</h2>
          <table id="legend"></table>
        </section>
        <section>
          <h2>Mapa</h2>
          <dl id="stats"></dl>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
